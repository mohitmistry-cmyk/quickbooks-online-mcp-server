version: '3.8'

services:
  quickbooks-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickbooks-mcp-server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "4022:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
