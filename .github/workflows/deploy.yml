name: Deploy Plimlico-Quickbooks-Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Verification
        run: npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/erudite/projects

            if [ ! -d "quickbooks-online-mcp-server" ]; then
              git clone git@github-plimlico-quickbook:mohitmistry-cmyk/quickbooks-online-mcp-server.git
            fi

            cd quickbooks-online-mcp-server
            git pull origin main

            docker compose up -d --build --remove-orphans

            # docker cp nests the source directory when the destination already
            # exists (for example ./dist/dist). Stage each build artifact under
            # a new name, then replace the host copies consumed by Lily.
            rm -rf ./dist.next ./node_modules.next
            docker cp quickbooks-mcp-server:/app/dist ./dist.next
            docker cp quickbooks-mcp-server:/app/node_modules ./node_modules.next
            rm -rf ./dist ./node_modules
            mv ./dist.next ./dist
            mv ./node_modules.next ./node_modules

            # Fail deployment instead of reporting success with a stale MCP.
            test -f ./dist/index.js
            test -f ./dist/tools/lookup-automation-entities.tool.js
            grep -q 'lookup_automation_entities' ./dist/tools/lookup-automation-entities.tool.js
